name: Deploy to Production

on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.image.outputs.image_name }}
    steps:
      - uses: actions/checkout@v3

      - name: Set image metadata
        id: image
        run: |
          IMAGE_TAG="ghcr.io/ootmm/tael-bot:master-${{ github.sha }}"
          echo "image_name=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: OoTMM-Bot
          password: ${{ secrets.PAT_TOKEN }}

      - name: Build
        run: docker build -t ${{ steps.image.outputs.image_name }} -f Dockerfile.prod .

      - name: Publish
        run: docker push ${{ steps.image.outputs.image_name }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infra Repo
        uses: actions/checkout@v3
        with:
          repository: OoTMM/infra
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.email "max.bacoux+ootmm-bot@gmail.com"
          git config --global user.name "OoTMM Bot"

      - name: Update Image Tag
        run: |
          IMAGE_NAME="${{ needs.publish.outputs.image_name }}"
          sed -i "s|ghcr.io/ootmm/tael-bot:.*|$IMAGE_NAME|g" stacks/tael-bot/compose.yaml

      - name: Commit and Push Changes
        run: |
          git add stacks/tael-bot/compose.yaml
          git commit -m "Update tael-bot image to ${{ needs.publish.outputs.image_name }}"
          git push origin master
